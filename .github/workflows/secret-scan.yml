name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out complete history without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reject secret-bearing paths anywhere in history
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nocasematch
          sensitive_path_count=0
          while IFS= read -r -d '' path; do
            basename="${path##*/}"
            case "$basename" in
              .master-key|paperless-llm.instance|paperless-llm.lock|.paperless-llm.instance.*.tmp|*.db|*.db-*|*.db.*|*.sqlite|*.sqlite-*|*.sqlite3|*.sqlite3-*|*.log|gitleaks-report.*|gitleaks-results.*|*.sarif|*.key|*.pem|*.p12|*.pfx|*.bak|*.backup|*.dump)
                ((sensitive_path_count += 1))
                ;;
              .env|.env.*|*.env|*.env.*|.envrc)
                case "$basename" in
                  *.env.example|*.env.sample|*.env.template) ;;
                  *) ((sensitive_path_count += 1)) ;;
                esac
                ;;
              paperless-llm-[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]-[0-9][0-9][0-9][0-9][0-9][0-9].tar.gz|paperless-llm-backup*.tar.gz|paperless-llm-backup*.tgz|paperless-llm-backup*.zip|paperlessllm-backup*.tar.gz|paperlessllm-backup*.tgz|paperlessllm-backup*.zip)
                ((sensitive_path_count += 1))
                ;;
            esac
            case "/$path/" in
              */.paperless-llm/*|*/.paperless-llm-backups/*|*/.direnv/*)
                ((sensitive_path_count += 1))
                ;;
            esac
          done < <(git log --all --format= --name-only --no-renames -z)
          if (( sensitive_path_count > 0 )); then
            # Do not print filenames: a filename itself can contain sensitive
            # material. Developers can reproduce the check locally to inspect
            # their own paths without copying them into a hosted CI log.
            echo "::error::Sensitive runtime or backup paths exist in Git history ($sensitive_path_count detected)"
            exit 1
          fi

      - name: Install verified Gitleaks 8.30.1
        shell: bash
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          install_dir="$RUNNER_TEMP/gitleaks-bin"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_LINUX_X64_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" gitleaks
          chmod 0755 "$install_dir/gitleaks"
          test "$("$install_dir/gitleaks" version)" = "$GITLEAKS_VERSION"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Scan all committed history for secrets
        shell: bash
        run: >-
          gitleaks git .
          --log-opts='--all'
          --redact=100
          --no-banner
          --no-color
          --verbose
          --max-archive-depth=2
          --max-decode-depth=2
          --timeout=300
