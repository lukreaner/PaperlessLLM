name: Release native binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build, for example v1.0.0
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build:
    name: Package ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release version
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be a semantic version beginning with v: $RELEASE_TAG" >&2
            exit 1
          fi

          crate_version="$(python3 -c '
          import pathlib, tomllib
          manifest = tomllib.loads(pathlib.Path("Cargo.toml").read_text())
          if manifest.get("package", {}).get("name") != "paperless-llm":
              raise SystemExit("Cargo.toml does not describe paperless-llm")
          print(manifest["package"]["version"])
          ')"
          if [[ "v$crate_version" != "$RELEASE_TAG" ]]; then
            echo "Cargo package version v$crate_version does not match $RELEASE_TAG" >&2
            exit 1
          fi
          if ! tag_commit="$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"; then
            echo "Release input does not identify an existing tag: $RELEASE_TAG" >&2
            exit 1
          fi
          head_commit="$(git rev-parse HEAD)"
          if [[ "$tag_commit" != "$head_commit" ]]; then
            echo "Checked-out commit does not match tag $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Validate release version on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$') {
              throw "Release tag must be a semantic version beginning with v: $env:RELEASE_TAG"
          }

          $manifest = Get-Content -LiteralPath "Cargo.toml" -Raw
          $package = [regex]::Match($manifest, '(?ms)^\[package\]\s*(.*?)(?=^\[|\z)')
          if (-not $package.Success) {
              throw "Cargo.toml does not contain a [package] section"
          }

          $name = [regex]::Match($package.Groups[1].Value, '(?m)^name\s*=\s*"([^"]+)"\s*$')
          $version = [regex]::Match($package.Groups[1].Value, '(?m)^version\s*=\s*"([^"]+)"\s*$')
          if (-not $name.Success -or $name.Groups[1].Value -ne "paperless-llm") {
              throw "Cargo.toml does not describe paperless-llm"
          }
          if (-not $version.Success) {
              throw "Cargo.toml does not contain a package version"
          }
          if ("v$($version.Groups[1].Value)" -ne $env:RELEASE_TAG) {
              throw "Cargo package version v$($version.Groups[1].Value) does not match $env:RELEASE_TAG"
          }

          $tagRef = 'refs/tags/' + $env:RELEASE_TAG + '^{commit}'
          $tagCommit = & git rev-parse --verify $tagRef
          if ($LASTEXITCODE -ne 0) {
              throw "Release input does not identify an existing tag: $env:RELEASE_TAG"
          }
          $tagCommit = $tagCommit.Trim()
          $headCommit = & git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) {
              throw "Could not resolve the checked-out release commit"
          }
          $headCommit = $headCommit.Trim()
          if ($tagCommit -ne $headCommit) {
              throw "Checked-out commit does not match tag $env:RELEASE_TAG"
          }

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Build embedded frontend
        working-directory: web
        run: npm run build

      - name: Install musl compiler
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-07-16
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: release-${{ matrix.target }}

      - name: Run target tests
        run: cargo test --locked --target "${{ matrix.target }}"

      - name: Build release binaries
        run: cargo build --locked --release --bins --target "${{ matrix.target }}"

      - name: Create and validate macOS app bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/paperless-llm"
          bundle="target/${{ matrix.target }}/release/PaperlessLLM.app"
          codesign --force --sign - "$binary"
          codesign --verify --strict --verbose=2 "$binary"
          packaging/macos/create-app-bundle.sh \
            --binary "$binary" \
            --version "${RELEASE_TAG#v}" \
            --build-version "$GITHUB_RUN_NUMBER" \
            --output "$bundle"
          plutil -lint "$bundle/Contents/Info.plist"
          test "$(plutil -extract CFBundleExecutable raw "$bundle/Contents/Info.plist")" = "paperless-llm"
          codesign --verify --strict --verbose=2 "$bundle/Contents/MacOS/paperless-llm"
          codesign --verify --deep --strict --verbose=2 "$bundle"
          "$bundle/Contents/MacOS/paperless-llm" --help >/dev/null

      - name: Smoke test CLI and health endpoint
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/paperless-llm"
          "$binary" --help >/dev/null

          smoke_dir="$RUNNER_TEMP/paperless-llm-smoke-${{ matrix.target }}"
          log_file="$RUNNER_TEMP/paperless-llm-smoke-${{ matrix.target }}.log"
          mkdir -p "$smoke_dir"
          chmod 700 "$smoke_dir"

          "$binary" serve \
            --data-dir "$smoke_dir" \
            --bind 127.0.0.1 \
            --port 18788 \
            --no-open >"$log_file" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          healthy=false
          for attempt in {1..30}; do
            if curl --silent --show-error --fail http://127.0.0.1:18788/healthz >/dev/null; then
              healthy=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$log_file"
              exit 1
            fi
            sleep 1
          done

          if [[ "$healthy" != "true" ]]; then
            cat "$log_file"
            exit 1
          fi

          "$binary" launch \
            --data-dir "$smoke_dir" \
            --bind 127.0.0.1 \
            --port 18788 \
            --no-open
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            "target/${{ matrix.target }}/release/PaperlessLLM.app/Contents/MacOS/paperless-llm" launch \
              --data-dir "$smoke_dir" \
              --bind 127.0.0.1 \
              --port 18788 \
              --no-open
          fi

      - name: Smoke test Windows CLI and health endpoint
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          & ".\.github\scripts\smoke-windows.ps1"
          -Binary "target/${{ matrix.target }}/release/paperless-llm.exe"
          -GuiBinary "target/${{ matrix.target }}/release/PaperlessLLM.exe"
          -Target "${{ matrix.target }}"

      - name: Validate Linux desktop installer
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/paperless-llm-desktop-${{ matrix.target }}"
          user_root="$RUNNER_TEMP/paperless-llm-desktop-user-${{ matrix.target }}"
          mkdir -p "$stage/packaging"
          install -m 0755 "target/${{ matrix.target }}/release/paperless-llm" "$stage/paperless-llm"
          cp -R packaging/linux "$stage/packaging/linux"
          HOME="$user_root" \
          XDG_DATA_HOME="$user_root/data" \
          PAPERLESSLLM_BIN_DIR="$user_root/bin" \
          PAPERLESSLLM_DESKTOP_DIR="$user_root/Desktop" \
            "$stage/packaging/linux/install-desktop.sh" --desktop-shortcut
          test -x "$user_root/bin/paperless-llm"
          test -f "$user_root/data/applications/io.paperlessllm.PaperlessLLM.desktop"
          test -x "$user_root/Desktop/PaperlessLLM.desktop"

      - name: Check optional Apple credentials
        id: apple_credentials
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          signing_values=("$MACOS_CERTIFICATE_P12_BASE64" "$MACOS_CERTIFICATE_PASSWORD" "$MACOS_SIGNING_IDENTITY")
          notary_values=("$APPLE_ID" "$APPLE_TEAM_ID" "$APPLE_APP_PASSWORD")

          signing_count=0
          for value in "${signing_values[@]}"; do [[ -n "$value" ]] && signing_count=$((signing_count + 1)); done
          notary_count=0
          for value in "${notary_values[@]}"; do [[ -n "$value" ]] && notary_count=$((notary_count + 1)); done

          if [[ "$signing_count" -ne 0 && "$signing_count" -ne 3 ]]; then
            echo "Configure all three macOS signing secrets or none of them." >&2
            exit 1
          fi
          if [[ "$notary_count" -ne 0 && "$notary_count" -ne 3 ]]; then
            echo "Configure all three Apple notarization secrets or none of them." >&2
            exit 1
          fi
          if [[ "$notary_count" -eq 3 && "$signing_count" -ne 3 ]]; then
            echo "Notarization credentials require a complete signing configuration." >&2
            exit 1
          fi

          [[ "$signing_count" -eq 3 ]] && echo "signing=true" >>"$GITHUB_OUTPUT" || echo "signing=false" >>"$GITHUB_OUTPUT"
          [[ "$notary_count" -eq 3 ]] && echo "notarization=true" >>"$GITHUB_OUTPUT" || echo "notarization=false" >>"$GITHUB_OUTPUT"

      - name: Import macOS signing certificate
        if: runner.os == 'macOS' && steps.apple_credentials.outputs.signing == 'true'
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/paperless-llm-signing.p12"
          keychain_path="$RUNNER_TEMP/paperless-llm-signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo "PAPERLESS_LLM_SIGNING_CERTIFICATE=$certificate_path" >>"$GITHUB_ENV"
          echo "PAPERLESS_LLM_SIGNING_KEYCHAIN=$keychain_path" >>"$GITHUB_ENV"

          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 -D >"$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          rm -f "$certificate_path"

      - name: Sign macOS CLI and app bundle
        if: runner.os == 'macOS' && steps.apple_credentials.outputs.signing == 'true'
        shell: bash
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/paperless-llm"
          bundle="target/${{ matrix.target }}/release/PaperlessLLM.app"
          bundle_binary="$bundle/Contents/MacOS/paperless-llm"
          codesign \
            --force \
            --options runtime \
            --timestamp \
            --keychain "$PAPERLESS_LLM_SIGNING_KEYCHAIN" \
            --sign "$MACOS_SIGNING_IDENTITY" \
            "$binary"
          codesign --verify --strict --verbose=2 "$binary"

          codesign \
            --force \
            --options runtime \
            --timestamp \
            --keychain "$PAPERLESS_LLM_SIGNING_KEYCHAIN" \
            --sign "$MACOS_SIGNING_IDENTITY" \
            "$bundle_binary"
          codesign \
            --force \
            --options runtime \
            --timestamp \
            --keychain "$PAPERLESS_LLM_SIGNING_KEYCHAIN" \
            --sign "$MACOS_SIGNING_IDENTITY" \
            "$bundle"
          codesign --verify --strict --verbose=2 "$bundle_binary"
          codesign --verify --deep --strict --verbose=2 "$bundle"

      - name: Notarize and staple macOS app bundle
        if: runner.os == 'macOS' && steps.apple_credentials.outputs.notarization == 'true'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/paperless-llm"
          bundle="target/${{ matrix.target }}/release/PaperlessLLM.app"
          notary_payload="$RUNNER_TEMP/paperless-llm-${{ matrix.target }}-notary"
          notary_archive="$RUNNER_TEMP/paperless-llm-${{ matrix.target }}-notary.zip"
          mkdir -p "$notary_payload"
          ditto "$bundle" "$notary_payload/PaperlessLLM.app"
          ditto "$binary" "$notary_payload/paperless-llm"
          ditto -c -k --sequesterRsrc --keepParent "$notary_payload" "$notary_archive"
          xcrun notarytool submit "$notary_archive" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait
          xcrun stapler staple "$bundle"
          xcrun stapler validate "$bundle"
          codesign --verify --deep --strict --verbose=2 "$bundle"
          spctl --assess --type execute --verbose=4 "$bundle"
          rm -f "$notary_archive"
          rm -rf "$notary_payload"

      - name: Check optional Windows signing credentials
        id: windows_credentials
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $certificateConfigured = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PFX_BASE64)
          $passwordConfigured = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)
          if ($certificateConfigured -ne $passwordConfigured) {
              throw "Configure both WINDOWS_CERTIFICATE_PFX_BASE64 and WINDOWS_CERTIFICATE_PASSWORD, or neither."
          }

          if ($certificateConfigured) {
              "signing=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              "Windows Authenticode signing is enabled." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }
          else {
              "signing=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              "Windows Authenticode signing is not configured; this release artifact will be unsigned." |
                  Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }

      - name: Import Windows signing certificate
        if: runner.os == 'Windows' && steps.windows_credentials.outputs.signing == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $certificateName = "paperless-llm-signing-$([guid]::NewGuid().ToString('N')).pfx"
          $certificatePath = Join-Path $env:RUNNER_TEMP $certificateName
          "PAPERLESS_LLM_WINDOWS_CERTIFICATE=$certificatePath" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $imported = @()
          try {
              $certificateBytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX_BASE64)
              try {
                  $certificateStream = [IO.File]::Open(
                      $certificatePath,
                      [IO.FileMode]::CreateNew,
                      [IO.FileAccess]::Write,
                      [IO.FileShare]::None
                  )
                  try {
                      $certificateStream.Write($certificateBytes, 0, $certificateBytes.Length)
                  }
                  finally {
                      $certificateStream.Dispose()
                  }
              }
              finally {
                  [Array]::Clear($certificateBytes, 0, $certificateBytes.Length)
              }

              $securePassword = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
              $imported = @(Import-PfxCertificate `
                  -FilePath $certificatePath `
                  -CertStoreLocation "Cert:\CurrentUser\My" `
                  -Password $securePassword)
              $signingCertificates = @($imported | Where-Object { $_.HasPrivateKey })
              if ($signingCertificates.Count -ne 1) {
                  throw "The Windows PFX must contain exactly one certificate with a private key."
              }

              $thumbprint = $signingCertificates[0].Thumbprint
              "PAPERLESS_LLM_WINDOWS_CERT_THUMBPRINT=$thumbprint" |
                  Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              Remove-Item -LiteralPath $certificatePath -Force
          }
          catch {
              foreach ($certificate in $imported) {
                  $certificateStorePath = "Cert:\CurrentUser\My\$($certificate.Thumbprint)"
                  if (Test-Path -LiteralPath $certificateStorePath) {
                      if ($certificate.HasPrivateKey) {
                          Remove-Item -LiteralPath $certificateStorePath -DeleteKey -Force
                      }
                      else {
                          Remove-Item -LiteralPath $certificateStorePath -Force
                      }
                  }
              }
              Remove-Item -LiteralPath $certificatePath -Force -ErrorAction SilentlyContinue
              throw
          }

      - name: Sign and verify Windows executables
        if: runner.os == 'Windows' && steps.windows_credentials.outputs.signing == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $signTool = Get-ChildItem `
              -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
              -Filter "signtool.exe" `
              -Recurse `
              -File |
              Where-Object { $_.DirectoryName -match '\\x64$' } |
              Sort-Object -Property FullName -Descending |
              Select-Object -First 1
          if ($null -eq $signTool) {
              throw "A 64-bit Windows SDK signtool.exe was not found on the runner."
          }

          $binaries = @(
              "target/${{ matrix.target }}/release/paperless-llm.exe",
              "target/${{ matrix.target }}/release/PaperlessLLM.exe"
          )
          foreach ($binary in $binaries) {
              & $signTool.FullName sign `
                  /sha1 $env:PAPERLESS_LLM_WINDOWS_CERT_THUMBPRINT `
                  /fd SHA256 `
                  /tr "http://timestamp.digicert.com" `
                  /td SHA256 `
                  /v `
                  $binary
              if ($LASTEXITCODE -ne 0) {
                  throw "SignTool failed to sign $binary with exit code $LASTEXITCODE"
              }

              & $signTool.FullName verify /pa /all /v $binary
              if ($LASTEXITCODE -ne 0) {
                  throw "SignTool failed to verify $binary with exit code $LASTEXITCODE"
              }
          }

      - name: Remove temporary Windows signing material
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $certificatePath = [Environment]::GetEnvironmentVariable("PAPERLESS_LLM_WINDOWS_CERTIFICATE")
          $thumbprint = [Environment]::GetEnvironmentVariable("PAPERLESS_LLM_WINDOWS_CERT_THUMBPRINT")
          if (-not [string]::IsNullOrWhiteSpace($thumbprint)) {
              $certificateStorePath = "Cert:\CurrentUser\My\$thumbprint"
              if (Test-Path -LiteralPath $certificateStorePath) {
                  Remove-Item -LiteralPath $certificateStorePath -DeleteKey -Force
              }
          }
          if (-not [string]::IsNullOrWhiteSpace($certificatePath)) {
              Remove-Item -LiteralPath $certificatePath -Force -ErrorAction SilentlyContinue
          }

      - name: Create release archive
        if: runner.os != 'Windows'
        shell: bash
        env:
          MACOS_NOTARIZED: ${{ steps.apple_credentials.outputs.notarization }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          archive_name="paperless-llm-${version}-${{ matrix.target }}"
          stage="$RUNNER_TEMP/$archive_name"
          mkdir -p "$stage"

          install -m 0755 "target/${{ matrix.target }}/release/paperless-llm" "$stage/paperless-llm"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            ditto "target/${{ matrix.target }}/release/PaperlessLLM.app" "$stage/PaperlessLLM.app"
            test -x "$stage/PaperlessLLM.app/Contents/MacOS/paperless-llm"
            codesign --verify --strict --verbose=2 "$stage/PaperlessLLM.app/Contents/MacOS/paperless-llm"
            codesign --verify --deep --strict --verbose=2 "$stage/PaperlessLLM.app"
          fi
          cp LICENSE "$stage/LICENSE"
          cp -R docs "$stage/docs"
          cp -R packaging "$stage/packaging"
          tar -C "$RUNNER_TEMP" -czf "$archive_name.tar.gz" "$archive_name"

          if [[ "$RUNNER_OS" == "macOS" ]]; then
            verify_root="$(mktemp -d "$RUNNER_TEMP/paperless-llm-release-verify.XXXXXX")"
            tar -C "$verify_root" -xzf "$archive_name.tar.gz"
            extracted="$verify_root/$archive_name"
            codesign --verify --strict --verbose=2 "$extracted/paperless-llm"
            codesign --verify --strict --verbose=2 "$extracted/PaperlessLLM.app/Contents/MacOS/paperless-llm"
            codesign --verify --deep --strict --verbose=2 "$extracted/PaperlessLLM.app"
            if [[ "$MACOS_NOTARIZED" == "true" ]]; then
              xcrun stapler validate "$extracted/PaperlessLLM.app"
              spctl --assess --type execute --verbose=4 "$extracted/PaperlessLLM.app"
            fi
            rm -rf "$verify_root"
          fi

      - name: Create Windows release archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:RELEASE_TAG.Substring(1)
          & ".\packaging\windows\create-release-bundle.ps1" `
              -ConsoleBinary "target/${{ matrix.target }}/release/paperless-llm.exe" `
              -GuiBinary "target/${{ matrix.target }}/release/PaperlessLLM.exe" `
              -Version $version `
              -Architecture "x86_64" `
              -OutputDirectory "." `
              -License "LICENSE" `
              -DocumentationDirectory "docs"

          $archive = "paperless-llm-$version-${{ matrix.target }}.zip"
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
              throw "Windows release builder did not create the expected archive: $archive"
          }
          & ".\packaging\windows\test-release-bundle.ps1" -Archive $archive
          & ".\packaging\windows\test-install-lifecycle.ps1" -Archive $archive

      - name: Upload packaged binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ matrix.target }}
          path: |
            paperless-llm-*.tar.gz
            paperless-llm-*.zip
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary signing keychain
        if: always() && runner.os == 'macOS' && env.PAPERLESS_LLM_SIGNING_KEYCHAIN != ''
        shell: bash
        run: |
          security delete-keychain "$PAPERLESS_LLM_SIGNING_KEYCHAIN" || true
          rm -f "$PAPERLESS_LLM_SIGNING_CERTIFICATE"

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: package-*
          path: release-artifacts
          merge-multiple: true

      - name: Create SHA-256 checksums
        working-directory: release-artifacts
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          artifacts=(
            "paperless-llm-${version}-aarch64-apple-darwin.tar.gz"
            "paperless-llm-${version}-x86_64-apple-darwin.tar.gz"
            "paperless-llm-${version}-aarch64-unknown-linux-musl.tar.gz"
            "paperless-llm-${version}-x86_64-unknown-linux-musl.tar.gz"
            "paperless-llm-${version}-x86_64-pc-windows-msvc.zip"
          )
          for artifact in "${artifacts[@]}"; do
            test -f "$artifact"
          done
          archive_count="$(find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l)"
          test "$archive_count" -eq 5
          printf '%s\0' "${artifacts[@]}" \
            | sort --zero-terminated \
            | xargs --null sha256sum >SHA256SUMS
          test "$(wc -l <SHA256SUMS)" -eq 5

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-artifacts/* --clobber
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "PaperlessLLM $RELEASE_TAG" \
              --generate-notes \
              release-artifacts/*
          fi
