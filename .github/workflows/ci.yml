name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Check frontend
        working-directory: web
        run: |
          npm run lint --if-present
          npm run test --if-present
          npm run build

      - name: Check packaging scripts
        run: |
          bash -n packaging/macos/create-app-bundle.sh
          sh -n packaging/linux/install-desktop.sh

      - name: Install browser for dashboard tests
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run dashboard browser tests
        working-directory: web
        run: npm run test:e2e

      - name: Upload browser-test report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: web/playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master 2026-07-16
        with:
          toolchain: stable
          components: clippy,rustfmt

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets --all-features

  native-build:
    name: Build and smoke test (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Build embedded frontend
        working-directory: web
        run: npm run build

      - name: Install musl compiler
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master 2026-07-16
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ matrix.target }}

      - name: Build release binaries
        run: cargo build --locked --release --bins --target "${{ matrix.target }}"

      - name: Run target tests
        run: cargo test --locked --target "${{ matrix.target }}"

      - name: Create and validate macOS app bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c '
          import pathlib, tomllib
          print(tomllib.loads(pathlib.Path("Cargo.toml").read_text())["package"]["version"])
          ')"
          binary="target/${{ matrix.target }}/release/paperless-llm"
          bundle="target/${{ matrix.target }}/release/PaperlessLLM.app"
          codesign --force --sign - "$binary"
          codesign --verify --strict --verbose=2 "$binary"
          packaging/macos/create-app-bundle.sh \
            --binary "$binary" \
            --version "$version" \
            --build-version "$GITHUB_RUN_NUMBER" \
            --output "$bundle"
          plutil -lint "$bundle/Contents/Info.plist"
          test "$(plutil -extract CFBundleExecutable raw "$bundle/Contents/Info.plist")" = "paperless-llm"
          codesign --verify --strict --verbose=2 "$bundle/Contents/MacOS/paperless-llm"
          codesign --verify --deep --strict --verbose=2 "$bundle"
          "$bundle/Contents/MacOS/paperless-llm" --help >/dev/null

      - name: Smoke test CLI and health endpoint
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/paperless-llm"
          "$binary" --help >/dev/null

          smoke_dir="$RUNNER_TEMP/paperless-llm-smoke-${{ matrix.target }}"
          log_file="$RUNNER_TEMP/paperless-llm-smoke-${{ matrix.target }}.log"
          mkdir -p "$smoke_dir"
          chmod 700 "$smoke_dir"

          "$binary" serve \
            --data-dir "$smoke_dir" \
            --bind 127.0.0.1 \
            --port 18788 \
            --no-open >"$log_file" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          healthy=false
          for attempt in {1..30}; do
            if curl --silent --show-error --fail http://127.0.0.1:18788/healthz >/dev/null; then
              healthy=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$log_file"
              exit 1
            fi
            sleep 1
          done

          if [[ "$healthy" != "true" ]]; then
            cat "$log_file"
            exit 1
          fi

          "$binary" launch \
            --data-dir "$smoke_dir" \
            --bind 127.0.0.1 \
            --port 18788 \
            --no-open
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            "target/${{ matrix.target }}/release/PaperlessLLM.app/Contents/MacOS/paperless-llm" launch \
              --data-dir "$smoke_dir" \
              --bind 127.0.0.1 \
              --port 18788 \
              --no-open
          fi

      - name: Smoke test Windows CLI and health endpoint
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          & ".\.github\scripts\smoke-windows.ps1"
          -Binary "target/${{ matrix.target }}/release/paperless-llm.exe"
          -GuiBinary "target/${{ matrix.target }}/release/PaperlessLLM.exe"
          -Target "${{ matrix.target }}"

      - name: Validate Windows release bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $metadataJson = & cargo metadata --locked --no-deps --format-version 1
          if ($LASTEXITCODE -ne 0) {
              throw "cargo metadata failed with exit code $LASTEXITCODE"
          }
          $metadata = $metadataJson | ConvertFrom-Json
          $packages = @($metadata.packages | Where-Object { $_.name -eq "paperless-llm" })
          if ($packages.Count -ne 1) {
              throw "cargo metadata did not return exactly one paperless-llm package"
          }

          $version = $packages[0].version
          $outputDirectory = Join-Path $env:RUNNER_TEMP "paperless-llm-windows-package-${{ matrix.target }}"
          & ".\packaging\windows\create-release-bundle.ps1" `
              -ConsoleBinary "target/${{ matrix.target }}/release/paperless-llm.exe" `
              -GuiBinary "target/${{ matrix.target }}/release/PaperlessLLM.exe" `
              -Version $version `
              -Architecture "x86_64" `
              -OutputDirectory $outputDirectory `
              -License "LICENSE" `
              -DocumentationDirectory "docs"

          $archive = Join-Path $outputDirectory "paperless-llm-$version-${{ matrix.target }}.zip"
          & ".\packaging\windows\test-release-bundle.ps1" -Archive $archive
          & ".\packaging\windows\test-install-lifecycle.ps1" -Archive $archive

      - name: Validate Linux desktop installer
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/paperless-llm-desktop-${{ matrix.target }}"
          user_root="$RUNNER_TEMP/paperless-llm-desktop-user-${{ matrix.target }}"
          mkdir -p "$stage/packaging"
          install -m 0755 "target/${{ matrix.target }}/release/paperless-llm" "$stage/paperless-llm"
          cp -R packaging/linux "$stage/packaging/linux"
          HOME="$user_root" \
          XDG_DATA_HOME="$user_root/data" \
          PAPERLESSLLM_BIN_DIR="$user_root/bin" \
          PAPERLESSLLM_DESKTOP_DIR="$user_root/Desktop" \
            "$stage/packaging/linux/install-desktop.sh" --desktop-shortcut
          test -x "$user_root/bin/paperless-llm"
          test -f "$user_root/data/applications/io.paperlessllm.PaperlessLLM.desktop"
          test -x "$user_root/Desktop/PaperlessLLM.desktop"
