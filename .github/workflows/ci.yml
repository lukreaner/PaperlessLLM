name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Check frontend
        working-directory: web
        run: |
          npm run lint --if-present
          npm run test --if-present
          npm run build

      - name: Install browser for dashboard tests
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run dashboard browser tests
        working-directory: web
        run: npm run test:e2e

      - name: Upload browser-test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets --all-features

  native-build:
    name: Build and smoke test (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build embedded frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Install musl compiler
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --target "${{ matrix.target }}"

      - name: Run target tests
        run: cargo test --locked --target "${{ matrix.target }}"

      - name: Smoke test CLI and health endpoint
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/paperless-llm"
          "$binary" --help >/dev/null

          smoke_dir="$RUNNER_TEMP/paperless-llm-smoke-${{ matrix.target }}"
          log_file="$RUNNER_TEMP/paperless-llm-smoke-${{ matrix.target }}.log"
          mkdir -p "$smoke_dir"
          chmod 700 "$smoke_dir"

          "$binary" serve \
            --data-dir "$smoke_dir" \
            --bind 127.0.0.1 \
            --port 18788 \
            --no-open >"$log_file" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --silent --show-error --fail http://127.0.0.1:18788/healthz >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$log_file"
              exit 1
            fi
            sleep 1
          done

          cat "$log_file"
          exit 1
